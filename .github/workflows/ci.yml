name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Rust stable
        run: rustup update stable

      - name: Use Rust stable
        run: rustup default stable

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Test
        run: cargo test --all-features --locked

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  i686:
    name: 32-bit x86 tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Install i686 target
        run: rustup target add i686-unknown-linux-gnu --toolchain 1.89.0

      - name: Install 32-bit development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386

      - name: Test i686
        run: cargo +1.89.0 test --target i686-unknown-linux-gnu --lib --locked

      - name: Test i686 against reference
        run: cargo +1.89.0 test --target i686-unknown-linux-gnu --test reference --locked


  big-endian:
    name: Big-endian compile check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Rust stable
        run: rustup update stable

      - name: Use Rust stable
        run: rustup default stable

      - name: Install PowerPC64 target
        run: rustup target add powerpc64-unknown-linux-gnu

      - name: Check
        run: cargo check --target powerpc64-unknown-linux-gnu --lib --all-features --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned deliberately. Every other job tracks stable, so nothing there
      # would notice an API that raises the floor advertised in Cargo.toml.
      # `slice::as_chunks` in src/portable.rs is what currently pins it to
      # 1.88; keep this in step with `rust-version`.
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal

      # The library only. Dev-dependencies are free to require a newer
      # compiler than the crate's own MSRV, and often do.
      - name: Check
        run: cargo +1.88 check --lib --all-features --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Rust stable
        run: rustup update stable

      - name: Use Rust stable
        run: rustup default stable

      # Installed from source rather than via a third-party action, to keep CI
      # free of dependencies this crate does not already have.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # The crate has no runtime dependencies, so this covers dev-dependencies
      # and guards against that changing unnoticed.
      - name: Audit
        run: cargo audit

  package:
    name: Package verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Rust stable
        run: rustup update stable

      - name: Use Rust stable
        run: rustup default stable

      - name: Verify package
        run: cargo package --locked